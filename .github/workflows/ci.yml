name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No LFS by default: the game assets are large and only one test reads one.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch the LFS assets tests read
        run: git lfs pull --include "public/models/parts/spoilers/spoilers.glb"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
