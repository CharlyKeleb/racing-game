name: Multiplayer health

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multiplayer-health.yml'
      - 'scripts/multiplayer/probe-hosted-practice.mjs'
  pull_request:
    paths:
      - '.github/workflows/multiplayer-health.yml'
      - 'scripts/multiplayer/probe-hosted-practice.mjs'

permissions:
  contents: read

concurrency:
  group: multiplayer-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/multiplayer/probe-hosted-practice.mjs --live
