<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cockpit calibration</title><style>body{margin:0;background:#101924;color:white;font:13px system-ui}#view{position:fixed;inset:0}nav{position:fixed;left:12px;top:12px;display:flex;gap:12px;background:#101924e8;padding:12px;flex-wrap:wrap;max-width:95vw}input{width:90px}button,select{background:#203346;color:white;border:1px solid #789;padding:6px}output{position:fixed;bottom:12px;left:12px;padding:12px;background:#101924e8;white-space:pre-line}</style><div id="view"></div><nav><label>Car <select id="car"><option value="porsche911">Porsche</option><option value="koenigsegg">Koenigsegg</option><option value="bmw">BMW</option></select></label><label>Quality <select id="quality"><option value="low">Low</option><option value="high">High</option></select></label><label><input type="checkbox" id="night"> Night</label><button id="camera">Chase view</button><label>Steer <input id="steer" type="range" min="-.5" max=".5" step=".01" value="0"></label><label>RPM <input id="rpm" type="range" min="900" max="7500" step="50" value="2500"></label><label>Speed <input id="speed" type="range" min="0" max="300" value="80"></label><label>Seat height <input id="height" type="range" min="-.04" max=".025" step=".005" value="0"></label><label>Seat distance <input id="distance" type="range" min="-.1" max=".08" step=".005" value="0"></label><label>FOV <input id="fov" type="range" min="-10" max="12" value="0"></label></nav><output>Loading car</output><script type="module" src="./cockpit.ts"></script></html>
