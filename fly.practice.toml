# Private-racing launch on the existing app. Deploy from the repository root.
# Resource/volume changes require the launch budget decision recorded in #120.
app = "charly-racing-multiplayer"
primary_region = "jnb"
kill_signal = "SIGTERM"
kill_timeout = "25s"

[build]
  dockerfile = "Dockerfile.race"
  ignorefile = "Dockerfile.race.dockerignore"

[env]
  NODE_ENV = "production"
  PORT = "2567"
  PRACTICE_SERVER_ENABLED = "1"
  MULTIPLAYER_SCHEDULED_INPUTS = "0"
  MULTIPLAYER_METRICS = "1"
  RESULT_OUTBOX_DIR = "/data/online-practice-outbox"
  ALLOWED_ORIGINS = "https://racing-game-jade.vercel.app"

[[mounts]]
  source = "practice_results"
  destination = "/data"
  initial_size = "1GB"

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 8
    hard_limit = 16

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "30s"
    method = "GET"
    path = "/readyz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
